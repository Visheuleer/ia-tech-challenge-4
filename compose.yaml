services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: clinical_monitor
      POSTGRES_USER: clinical_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinical_monitor_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_monitor -d clinical_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

