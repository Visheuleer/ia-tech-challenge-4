[project]
name = "clinical-monitor"
version = "0.1.0"
description = "Monitoramento clínico multimodal - Tech Challenge Fase 4"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
