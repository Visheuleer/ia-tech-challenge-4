name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: clinical_test
          POSTGRES_USER: clinical_test
          POSTGRES_PASSWORD: clinical_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinical_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://clinical_test:clinical_test@127.0.0.1:5432/clinical_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
